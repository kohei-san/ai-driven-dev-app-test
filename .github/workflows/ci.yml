name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx next typegen && npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Architecture boundary check (DDD)
        run: npm run arch:check

      - name: Run unit & integration tests (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build application (Next.js)
        run: npm run build